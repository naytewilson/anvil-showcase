  <text x="352" y="186" fill="#F5F5F8" font-family="Arial, Helvetica, sans-serif" font-size="113" font-weight="800" letter-spacing="10">ANVIL</text>
  <rect x="359" y="210" width="650" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="359" y="258" fill="#DFE6F2" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" letter-spacing="2.3">AUTONOMOUS AGENT OPERATING SYSTEM</text>
  <text x="361" y="295" fill="#8E9EB6" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="2">COORDINATE  /  EXECUTE  /  VERIFY  /  REMEMBER</text>
