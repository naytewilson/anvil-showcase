    <path d="M83 126H146L154 154H75Z" fill="#C77752"/>
    <path d="M63 154H168Q173 154 173 159V168H58V159Q58 154 63 154Z" fill="#FDB777"/>
    <path d="M83 65H172" stroke="#FFF3D5" stroke-opacity=".75" stroke-width="4" stroke-linecap="round"/>
    <path d="M45 86H75" stroke="#FFF3D5" stroke-opacity=".50" stroke-width="3" stroke-linecap="round"/>
    <path d="M113 40L115 29M133 48L145 37M93 46L83 35" stroke="#83E8DA" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="114" cy="18" r="3" fill="#83E8DA"/>
