<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="336" viewBox="0 0 1200 336" role="img" aria-labelledby="title desc">
  <title id="title">ANVIL — Agent Operating System</title>
  <desc id="desc">A luminous copper anvil emblem and ANVIL wordmark on a midnight blue technical grid.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080F20"/>
      <stop offset="58%" stop-color="#12162B"/>
      <stop offset="100%" stop-color="#21182D"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE4B5"/>
      <stop offset="33%" stop-color="#FFC675"/>
      <stop offset="72%" stop-color="#E78748"/>
      <stop offset="100%" stop-color="#BF5940"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFBC73"/>
      <stop offset="58%" stop-color="#D88A72"/>
      <stop offset="100%" stop-color="#78DDD1"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0%" stop-color="#F6A76E" stop-opacity=".22"/>
      <stop offset="80%" stop-color="#F6A76E" stop-opacity=".045"/>
      <stop offset="100%" stop-color="#F6A76E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#9CB2CC" stroke-width=".65" opacity=".09"/>
    </pattern>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1200" height="336" rx="22" fill="url(#background)"/>
  <rect x="0" y="0" width="1200" height="336" rx="22" fill="url(#grid)"/>
  <circle cx="197" cy="161" r="183" fill="url(#halo)"/>
